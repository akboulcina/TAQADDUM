name: PR checks
on: [pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: cimg/postgres:16.10-postgis
        env:
          POSTGRES_DB: taqaddum
          POSTGRES_USER: taqaddum
          POSTGRES_PASSWORD: ${{ secrets.TAQADDUM_CI_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taqaddum -d taqaddum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap database
        env:
          PGPASSWORD: ${{ secrets.TAQADDUM_CI_DB_PASSWORD }}
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: taqaddum
          PGDATABASE: taqaddum
        run: |
          set -euo pipefail
          for script in database/bootstrap/*.sql; do
            echo "Applying $script"
            psql -v ON_ERROR_STOP=1 -f "$script"
          done
          for migration in database/migrations/*.sql; do
            case "$migration" in
              database/migrations/20261027_users_kpis_alerts.sql)
                continue
                ;;
              database/migrations/20261027_project_monitoring.sql)
                echo "Applying prerequisite database/migrations/20261027_users_kpis_alerts.sql"
                psql -v ON_ERROR_STOP=1 -f database/migrations/20261027_users_kpis_alerts.sql
                ;;
            esac
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
          for fixture in database/test-fixtures/*.sql; do
            echo "Applying $fixture"
            psql -v ON_ERROR_STOP=1 -f "$fixture"
          done
      - name: Database audit tests
        env:
          DATABASE_URL: postgresql://taqaddum:${{ secrets.TAQADDUM_CI_DB_PASSWORD }}@localhost:5432/taqaddum
        run: bash database/tests/audit-platform-tests.sh
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test -- --reporter=verbose
      - run: pnpm boundaries
      - name: Validate Compose configuration only
        env:
          POSTGRES_PASSWORD: ${{ format('config-only-postgres-{0}', github.run_id) }}
          MINIO_ROOT_PASSWORD: ${{ format('config-only-minio-{0}', github.run_id) }}
          DOCKER_DATABASE_URL: postgresql://postgres:5432/taqaddum
        run: docker compose config --quiet
      - run: pnpm build
