name: Credential checks

on:
  pull_request:
  push:
    branches:
      - main
      - feature/import-ready-data
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracked-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test portable credential checker
        run: python3 -m unittest discover -s scripts/security -p 'test_*.py' -v
      - name: Check tracked text and Excel credential columns
        run: python3 scripts/security/scan_credentials.py
