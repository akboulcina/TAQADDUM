services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: taqaddum
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d taqaddum']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    depends_on:
      postgres:
        condition: service_healthy
  web:
    depends_on:
      api:
        condition: service_started
volumes:
  postgres_data:
