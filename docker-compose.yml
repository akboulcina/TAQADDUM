services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: taqaddum
      POSTGRES_USER: taqaddum
      POSTGRES_PASSWORD: taqaddum_local_only
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taqaddum -d taqaddum']
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minio_local
      MINIO_ROOT_PASSWORD: minio_local_password_only
    ports: ['9000:9000', '9001:9001']
  api:
    build: ./apps/api
    environment:
      NODE_ENV: local
      APP_VERSION: 0.1.0
      PORT: 3000
    ports: ['3000:3000']
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
  worker:
    build: ./apps/worker
    environment:
      NODE_ENV: local
      APP_VERSION: 0.1.0
    depends_on:
      postgres: { condition: service_healthy }
  web:
    build: ./apps/web
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    ports: ['5173:80']
    depends_on: [api]
